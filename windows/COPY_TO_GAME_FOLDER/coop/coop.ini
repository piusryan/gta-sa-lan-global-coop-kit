; Настройки SA:COOP (файл в кодировке UTF-8). Ник, адрес и пароль проще менять в игре, в окне F9.

[player]
; Ник: до 20 символов (буквы, цифры, знаки _-.[])
name = Pius
; Язык окна F9, чата и подсказок: ru или en. Переключается и в окне F9.
language = en
skin = batmanv2.dff

[connect]
; Поставьте 1, чтобы подключаться сразу при запуске игры, без окна F9.
auto_connect = 0
; Режим: join (подключиться к другу) или host (создать свой сервер)
mode = host
; Адрес друга (IP или имя компьютера) или код приглашения вида XXXX-XXXX-XXXX
host = 127.0.0.1
port = 7788
password = 123
; Для хоста: номер сохранения (1–8), которое загрузится при автозапуске. Если 0, сохранение выбирается в меню.
load_slot = 0
; Для хоста: поставьте 1, чтобы игроки могли ранить и убивать друг друга. Это галочка в окне F9.
friendly_fire = 0
; Для хоста: поставьте 0, чтобы напарники не могли перемещаться командами /tp и /tphere. Это галочка в окне F9.
partner_teleport = 1
; Для хоста: поставьте 1, чтобы гибель напарника проваливала сюжетную миссию хоста. Это галочка в окне F9.
shared_life = 0
max_players = 2
partner_cheats = 1

[game]
; Поставьте 1, чтобы играть в окне.
windowed = 0
; Игра не встаёт на паузу, когда окно не в фокусе. Для совместной игры это нужно.
run_in_background = 1
; Меню паузы не останавливает мир, чтобы напарник мог играть дальше.
no_pause_menu = 1
skip_intro = 1
; Поставьте 0, чтобы радар в машине не рисовал путь до метки и цели миссии (например, с модом на радар).
gps = 1
mark_colour = green

[voice]
enabled = 0
; Клавиша голосовой связи (код клавиши Windows, 66 = B)
push_to_talk_key = 66
; Поставьте 1, чтобы микрофон работал всегда, без клавиши.
always_on = 0
; Поставьте 1, чтобы нажатие клавиши включало микрофон, а следующее выключало.
toggle = 0
; Громкость напарника и усиление микрофона. Значение 1.0 оставляет их без изменений.
volume = 1.0
mic_gain = 1.0
; Чем дальше напарник, тем тише его слышно, но совсем он не пропадает.
proximity = 1

[keys]
; Коды клавиш Windows: чат (84 = T), сесть пассажиром (71 = G), список игроков (113 = F2). Их проще
; поменять в окне F9, кнопка «Клавиши».
chat = 84
enter_as_passenger = 71
player_list = 113

[debug]
; Отладочная информация на экране и подробный лог. Включайте, если вас попросили прислать лог.
overlay = 0
verbose_log = 0
