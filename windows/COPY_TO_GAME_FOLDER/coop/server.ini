; Настройки сервера SA:COOP
[server]
name = GTA SA Story Co-op (LAN)
port = 7788
; Оставьте пустым, если пароль не нужен.
password =
; Сколько игроков в игре: от 2 до 4.
max_players = 2
; Ник игрока, который всегда будет хостом. Если пусто, хостом становится тот, кто зашёл первым.
host =
motd = Welcome! Type /help for commands.
; Поставьте 1, чтобы игроки могли ранить и убивать друг друга.
friendly_fire = 0
; Поставьте 0, чтобы напарники не могли перемещаться командами /tp и /tphere.
partner_teleport = 1
; Поставьте 1, чтобы гибель напарника проваливала сюжетную миссию хоста.
shared_life = 0
; Игра через интернет (UPnP, код приглашения, пробивка NAT). Если поставить 0, останется только локальная сеть.
internet = 0
; Ретранслятор на случай, если друг не может подключиться по коду.
; С бесплатным аккаунтом metered.ca:   turn = metered:<имя приложения>:<API-ключ>
; С любым TURN-сервером:               turn = turn:<адрес>:<порт>:<логин>:<пароль>
turn =
